<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>下北沢にて'26 会場マップ</title>
<style>
  :root {
    --bg: #e9e9e6;
    --ink: #1d1d1f;
    --sub: #6b6b70;
    --pin: #8a8a90;
    --pin-want: #e0352b;
    --route: #1f6fd1;
    --pin-ring: #ffffff;
    --label-bg: rgba(255,255,255,.94);
    --bar-bg: rgba(20,20,22,.9);
    --bar-ink: #fff;
    --sheet-bg: #ffffff;
    --line: #e4e4e8;
    --p1: #e0352b; --p2: #f08a24; --p3: #d9b400; --p4: #8a8a90; --p5: #2e9d5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  #viewport {
    position: fixed; inset: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  #viewport.dragging { cursor: grabbing; }
  #map {
    position: absolute; left: 0; top: 0;
    transform-origin: 0 0; will-change: transform;
    -webkit-user-drag: none; pointer-events: none;
  }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #pins { position: absolute; inset: 0; pointer-events: none; }
  .dot {
    position: absolute; left: 0; top: 0; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: var(--pin);
    box-shadow: 0 0 0 2px var(--pin-ring), 0 1px 3px rgba(0,0,0,.4);
  }
  .dot.want { background: var(--pin-want); }
  .dot.route { background: var(--route); width: 14px; height: 14px; margin: -7px 0 0 -7px; }
  .label {
    position: absolute; left: 0; top: 0;
    font-size: 11px; font-weight: 700; line-height: 1.25;
    padding: 2px 5px; border-radius: 4px;
    background: var(--label-bg); white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .label .steps { color: #fff; background: var(--route); margin-left: 4px; padding: 0 4px; border-radius: 3px; font-size: 10px; }
  .label.dim { color: var(--sub); font-weight: 600; }
  .live { display: block; font-size: 10px; font-weight: 600; color: #333; line-height: 1.3; }
  .lives { display: block; margin-top: 2px; padding-top: 2px; border-top: 1px solid var(--line); }
  .live .vn { color: var(--sub); margin-right: 3px; }
  .live .an { display: inline-block; max-width: 9em; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
  .live .tm { color: var(--sub); font-variant-numeric: tabular-nums; margin-left: 3px; }
  .live.now .an { color: #c0392b; font-weight: 800; }
  .live.now::before { content: "● "; color: #e53935; }
  .live.nx::before { content: "次 "; color: var(--sub); }
  .live.gap { color: var(--sub); }
  .live.mine .an { text-decoration: underline; text-decoration-color: var(--route); text-decoration-thickness: 2px; }
  #clock {
    pointer-events: auto; font: inherit; font-size: 12px; font-weight: 700;
    border: 0; border-radius: 999px; padding: 3px 10px;
    background: rgba(255,255,255,.18); color: var(--bar-ink); font-variant-numeric: tabular-nums;
  }
  #clock.debug { background: #e67e22; color: #fff; }
  #btn-help {
    pointer-events: auto; font: inherit; font-size: 12px; font-weight: 800; width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.18); color: var(--bar-ink); margin-left: 4px;
  }
  .ctl { display: flex; gap: 6px; margin-top: 4px; }
  .ctl select, .ctl button {
    font: inherit; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: #333; -webkit-appearance: none; appearance: none;
  }
  .ctl select.b1 { background: var(--p1); } .ctl select.b2 { background: var(--p2); } .ctl select.b3 { background: var(--p3); }
  .ctl select.b4 { background: var(--p4); } .ctl select.b5 { background: var(--p5); }
  .ctl select.b1, .ctl select.b2, .ctl select.b4, .ctl select.b5 { color: #fff; border-color: transparent; }
  .ctl select.b3 { color: #222; border-color: transparent; }
  .ctl .go-btn.on { background: var(--route); color: #fff; border-color: transparent; }
  .step { position: relative; grid-template-columns: 28px 1fr 32px !important; cursor: pointer; }
  .edit-btn { align-self: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: #333; font-size: 15px; padding: 0; }
  .step .warn, .walk .warn { color: #c0392b; }
  .search { padding: 10px 16px 6px; position: sticky; top: -4px; background: var(--sheet-bg); z-index: 1; }
  .search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); }
  .dbg textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; margin-top: 10px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); }
  .share { border-top: 6px solid #f3f3f5; margin-top: 8px; }
  .row.now { background: #fdecea; }
  .row.now .t::before { content: "● "; color: #e53935; }
  .dbg { padding: 12px 16px; font-size: 13px; }
  .dbg input[type=time] { font: inherit; font-size: 20px; padding: 4px 8px; }
  .dbg .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .dbg button { font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #f6f6f8; color: #222; }
  .dbg button.go { background: var(--route); color: #fff; border-color: transparent; }
  .dbg p { color: var(--sub); font-size: 11px; margin: 10px 0 0; }
  header {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
    background: var(--bar-bg); color: var(--bar-ink);
    font-size: 14px; font-weight: 700; letter-spacing: .02em;
    display: flex; justify-content: space-between; align-items: baseline;
    pointer-events: none;
  }
  header small { font-weight: 400; opacity: .75; font-size: 11px; }
  #attr {
    position: fixed; right: 4px; bottom: calc(env(safe-area-inset-bottom) + 58px);
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: rgba(255,255,255,.85); color: #333;
  }
  #attr a { color: inherit; }
  .fab-row {
    position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
    display: flex; gap: 6px; right: 12px;
  }
  .fab {
    font: inherit; font-size: 12px; font-weight: 700;
    padding: 9px 11px; border: 0; border-radius: 999px; white-space: nowrap;
    background: var(--bar-bg); color: var(--bar-ink);
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .fab.primary { background: var(--route); }
  .fab.on { background: #e53935; }
  #btn-geo {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 84px);
    width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
    background: #fff; color: #1a73e8; font-size: 22px; line-height: 44px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  #btn-geo.active { background: #1a73e8; color: #fff; }
  .me-acc { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(26,115,232,.15); border: 1px solid rgba(26,115,232,.4); pointer-events: none; }
  .me {
    position: absolute; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; background: #1a73e8; box-shadow: 0 0 0 3px #fff, 0 1px 4px rgba(0,0,0,.5);
    pointer-events: none; z-index: 2;
  }
  .me::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 3px solid #1a73e8; animation: mepulse 1.6s ease-out infinite;
  }
  @keyframes mepulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 48px); transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 999px;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* ボトムシート */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    max-height: 62vh; display: flex; flex-direction: column;
    background: var(--sheet-bg); border-radius: 14px 14px 0 0;
    box-shadow: 0 -4px 18px rgba(0,0,0,.25);
    transform: translateY(105%); transition: transform .22s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #sheet.open { transform: none; }
  #sheet-head {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
  }
  #sheet-title { font-size: 16px; font-weight: 800; }
  #sheet-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }
  #sheet-close {
    margin-left: auto; flex: none; border: 0; background: #eee; color: #333;
    width: 30px; height: 30px; border-radius: 50%; font-size: 16px; line-height: 30px; padding: 0;
  }
  #sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 12px; }
  .venue-block + .venue-block { border-top: 6px solid #f3f3f5; }
  .venue-name { font-size: 12px; font-weight: 800; color: var(--sub); padding: 10px 16px 2px; }
  .row {
    display: grid; grid-template-columns: 84px 1fr; gap: 8px; align-items: baseline;
    padding: 7px 16px; font-size: 14px;
  }
  .row .t { font-variant-numeric: tabular-nums; color: var(--sub); font-size: 12px; }
  .row.comedy .n::before { content: "芸人 "; font-size: 10px; color: var(--sub); }
  .row.ev .n { color: var(--sub); }
  .row.in-route { background: #eaf2fd; }
  .row .n { font-weight: 600; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 800; color: #fff;
    padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px;
  }
  .b1 { background: var(--p1); } .b2 { background: var(--p2); } .b3 { background: var(--p3); color: #222; }
  .b4 { background: var(--p4); } .b5 { background: var(--p5); }
  .note { font-size: 10px; color: var(--sub); margin-left: 4px; }

  .step {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px;
    padding: 8px 16px; font-size: 14px; border: 0; background: none; width: 100%; text-align: left; font: inherit;
    color: inherit;
  }
  .step .num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--route); color: #fff;
    font-size: 12px; font-weight: 800; display: grid; place-items: center;
  }
  .step.rest .num { background: var(--pin); }
  .step .t { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .step .a { font-weight: 700; }
  .step .m { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .walk { font-size: 11px; color: var(--sub); padding: 0 16px 0 54px; }
  .prof { display: block; font-size: 12px; font-weight: 400; color: #444; line-height: 1.5; margin-top: 3px; }
  .prof.none { color: var(--sub); }
  .prof .warn { color: #b26a00; font-size: 10px; }
  .links { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; }
  .links a { color: var(--route); text-decoration: none; margin-right: 10px; }
  .win-head { padding: 12px 16px 4px; font-size: 13px; font-weight: 800; background: #f3f3f5; }
  .win-head small { display: block; font-weight: 400; color: var(--sub); font-size: 11px; margin-top: 2px; }
  .missed { padding: 10px 16px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="viewport">
  <img id="map" src="map.jpg" alt="下北沢周辺地図" draggable="false">
  <svg id="overlay"></svg>
  <div id="pins"></div>
</div>
<header><span>下北沢にて'26 会場マップ <button id="btn-help" type="button" aria-label="使い方">?</button></span> <button id="clock" type="button" aria-label="時刻設定">12/5</button></header>
<div class="fab-row">
  <button class="fab primary" id="btn-route" type="button">ルート</button>
  <button class="fab" id="btn-free" type="button">空き時間</button>
  <button class="fab" id="btn-want" type="button">見たい一覧</button>
  <button class="fab" id="btn-live" type="button">今/次</button>
  <button class="fab" id="btn-reset" type="button">全体</button>
</div>
<button id="btn-geo" type="button" aria-label="現在地">◎</button>
<div id="toast"></div>
<div id="attr">出典：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院 淡色地図</a></div>
<section id="sheet" aria-hidden="true">
  <div id="sheet-head">
    <div><div id="sheet-title"></div><div id="sheet-sub"></div></div>
    <button id="sheet-close" type="button" aria-label="閉じる">×</button>
  </div>
  <div id="sheet-body"></div>
</section>

<script src="timetable.js"></script>
<script src="profiles.js"></script>
<script>
// 背景画像 = 地理院タイル(淡色) z18 を x0..x0+cols-1, y0..y0+rows-1 で結合したもの
const TILE = { z: 18, x0: 232772, y0: 103240, cols: 6, rows: 10, size: 256 };

// 同一建物の会場は1ピンにまとめる(names は TIMETABLE のキーと一致)
const VENUES = [
  { names: ["シャングリラ"], addr: "世田谷区北沢2-4-5", lat: 35.660599, lon: 139.668442 },
  { names: ["CLUB251", "440"], addr: "世田谷区代沢5-29-15", lat: 35.65826, lon: 139.66748 },
  { names: ["BASEMENTBAR", "THREE"], addr: "世田谷区代沢5-18-1", lat: 35.6567, lon: 139.667465 },
  { names: ["LIVE HOLIC"], addr: "世田谷区北沢2-6-5", lat: 35.661591, lon: 139.669006 },
  { names: ["Flowers Loft"], addr: "世田谷区北沢2-24-5", lat: 35.662239, lon: 139.667572 },
  { names: ["mona records"], addr: "世田谷区北沢2-13-5", lat: 35.660446, lon: 139.667465 },
  { names: ["CREAM"], addr: "世田谷区北沢2-33-7", lat: 35.663261, lon: 139.668655 },
  { names: ["ReG"], addr: "世田谷区代沢5-30-10", lat: 35.658104, lon: 139.667984 },
  { names: ["SHELTER"], addr: "世田谷区北沢2-6-10", lat: 35.661472, lon: 139.66954 },
  { names: ["SPREAD"], addr: "世田谷区北沢2-12-6", lat: 35.660881, lon: 139.667587 },
  { names: ["LIVE HAUS"], addr: "世田谷区北沢2-14-2", lat: 35.659477, lon: 139.66745 },
  { names: ["MOSAiC"], addr: "世田谷区北沢2-2-14", lat: 35.659756, lon: 139.668625 },
  { names: ["DaisyBar", "Laguna"], addr: "世田谷区北沢2-2-3", lat: 35.659512, lon: 139.668137 },
  { names: ["ERA"], addr: "世田谷区北沢2-34-5", lat: 35.663372, lon: 139.668243 },
  { names: ["WAVER"], addr: "世田谷区北沢2-14-13", lat: 35.66013, lon: 139.667969 },
  { names: ["近松"], addr: "世田谷区北沢2-14-16", lat: 35.65979, lon: 139.667725 },
  { names: ["近道", "おてまえ"], addr: "世田谷区北沢3-31-15", lat: 35.664639, lon: 139.667053 },
  { names: ["下北線路街空き地"], addr: "世田谷区北沢2丁目(下北線路街)", lat: 35.662768, lon: 139.668989 },
  { names: ["下北沢駅前広場"], addr: "下北沢駅前", lat: 35.6618, lon: 139.6672 },
];

// 緯度経度 → 背景画像上のピクセル座標(Webメルカトル)
function project(lat, lon) {
  const n = 2 ** TILE.z;
  const x = (lon + 180) / 360 * n;
  const y = (1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * n;
  return { x: (x - TILE.x0) * TILE.size, y: (y - TILE.y0) * TILE.size };
}
// 2会場間の徒歩目安(直線距離×1.3 / 分速75m)
function walkMin(a, b) {
  const dy = (a.lat - b.lat) * 111000, dx = (a.lon - b.lon) * 111000 * Math.cos(a.lat * Math.PI / 180);
  return Math.max(1, Math.round(Math.hypot(dx, dy) * 1.3 / 75));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const IMG_W = TILE.cols * TILE.size, IMG_H = TILE.rows * TILE.size;
const vp = document.getElementById("viewport");
const img = document.getElementById("map");
const pinLayer = document.getElementById("pins");
const svg = document.getElementById("overlay");
const SVGNS = "http://www.w3.org/2000/svg";

// ---- 見たい一覧とルート(端末ごとに localStorage に保存。共有リンクで受け渡し) ----
const PRIORITY_LABEL = { 1: "絶対", 2: "被らなければ", 3: "出来れば", 4: "未見", 5: "気になる" };
const PLAN_KEY = "shimonite-plan";
let plan = { want: {}, route: [] }; // route: [{ venue, act, s?, e?, memo? }]
let hadPlan = false;
try {
  const p = JSON.parse(localStorage.getItem(PLAN_KEY));
  if (p && p.want && p.route) { plan = p; hadPlan = true; }
} catch (_) {}
function savePlan() { try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch (_) {} }
const toMin = t => { const [h, m] = t.split(":"); return h * 60 + +m; };
const findAct = (venue, name) => (TIMETABLE[venue] || []).find(a => a.n === name);
let WANT = {}, ROUTE = [], routeActs = new Set();
function derive() {
  WANT = plan.want;
  ROUTE = plan.route.map(r => {
    const a = findAct(r.venue, r.act);
    return { ...r, s: r.s || (a ? a.s : "00:00"), e: r.e || (a ? a.e : "00:00"), a };
  }).sort((x, y) => toMin(x.s) - toMin(y.s) || toMin(x.e) - toMin(y.e));
  routeActs = new Set(ROUTE.map(r => r.venue + "|" + r.act));
}
derive();
const inRoute = (venue, name) => routeActs.has(venue + "|" + name);
function toggleRoute(venue, name) {
  const k = plan.route.findIndex(r => r.venue === venue && r.act === name);
  if (k >= 0) plan.route.splice(k, 1); else plan.route.push({ venue, act: name });
  planChanged();
}
function setWant(name, p) {
  if (p) plan.want[name] = p; else delete plan.want[name];
  planChanged();
}
function planChanged() { savePlan(); derive(); refreshPins(); if (sheetRefresh) sheetRefresh(); }

const venueToPin = {};
const pins = VENUES.map((v, i) => {
  const p = project(v.lat, v.lon);
  v.names.forEach(n => venueToPin[n] = i);
  const dot = document.createElement("div");
  const label = document.createElement("div");
  pinLayer.append(dot, label);
  const line = document.createElementNS(SVGNS, "line");
  line.setAttribute("stroke", "#555"); line.setAttribute("stroke-width", "1");
  svg.appendChild(line);
  return { i, v, x: p.x, y: p.y, dot, label, line, steps: [], want: false, w: 0, h: 0, rect: null, rank: 2 };
});

// ルート線(会場間を順に結ぶ)
const routePath = document.createElementNS(SVGNS, "polyline");
routePath.setAttribute("fill", "none");
routePath.setAttribute("stroke", "var(--route)");
routePath.setAttribute("stroke-width", "3");
routePath.setAttribute("stroke-opacity", ".4");
routePath.setAttribute("stroke-linejoin", "round");
routePath.setAttribute("stroke-linecap", "round");
svg.insertBefore(routePath, svg.firstChild);
let routePins = [];
let showRoute = true;
// 見たい/ルートの変更をピンの色・番号・ルート線に反映
function refreshPins() {
  for (const p of pins) {
    const acts = p.v.names.flatMap(n => TIMETABLE[n] || []);
    p.want = acts.some(a => WANT[a.n]);
    p.steps = ROUTE.map((r, k) => p.v.names.includes(r.venue) ? k : -1).filter(k => k >= 0);
    p.rank = p.steps.length ? 0 : p.want ? 1 : 2;
    p.dot.className = "dot" + (p.steps.length ? " route" : p.want ? " want" : "");
    p.label.className = "label" + (p.steps.length || p.want ? "" : " dim");
    p.label.dataset.head = esc(p.v.names.join(" / ")) +
      (p.steps.length ? `<span class="steps">${p.steps.map(k => k + 1).join("·")}</span>` : "");
  }
  routePins = [];
  for (const r of ROUTE) {
    const pi = venueToPin[r.venue];
    if (pi != null && routePins[routePins.length - 1] !== pi) routePins.push(pi);
  }
  if (typeof refreshLive === "function" && clockBtn) refreshLive();
}

// ---- 現在時刻(12/5 の何分か)。デバッグ時は設定時刻から実時間で進む ----
const FEST_DATE = "2026-12-05";
const DBG_KEY = "shimonite-debug-time";
let dbg = null; // { base: 分, at: 設定した実時刻ms }
try { dbg = JSON.parse(localStorage.getItem(DBG_KEY)) || null; } catch (_) {}
{
  const m = location.search.match(/[?&]t=(\d{1,2}):?(\d{2})/);
  if (m) dbg = { base: +m[1] * 60 + +m[2], at: Date.now() };
}
function saveDbg() {
  try { dbg ? localStorage.setItem(DBG_KEY, JSON.stringify(dbg)) : localStorage.removeItem(DBG_KEY); } catch (_) {}
}
// 当日なら分(0-1439+)、当日以外なら null
function nowMin() {
  if (dbg) return dbg.base + (Date.now() - dbg.at) / 60000;
  const j = new Date(Date.now() + 9 * 3600e3); // JST
  if (j.toISOString().slice(0, 10) !== FEST_DATE) return null;
  return j.getUTCHours() * 60 + j.getUTCMinutes() + j.getUTCSeconds() / 60;
}
const fmtMin = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}`;

// 会場の「今」と「次」
function nowNext(venue, t) {
  const acts = TIMETABLE[venue] || [];
  const cur = acts.find(a => toMin(a.s) <= t && t < toMin(a.e));
  const nxt = acts.find(a => toMin(a.s) > t);
  return { cur, nxt };
}
const isMine = (venue, a) => routeActs.has(venue + "|" + a.n) || !!WANT[a.n];
function liveLine(cls, vn, venue, a) {
  return `<span class="live ${cls}${isMine(venue, a) ? " mine" : ""}">${vn}` +
    `<span class="an">${a.c ? "芸人 " : ""}${esc(a.n)}</span><span class="tm">${a.s}–${a.e}</span></span>`;
}
let showLive = true;
try { showLive = localStorage.getItem("shimonite-live") !== "0"; } catch (_) {}
function refreshLive() {
  const t = nowMin();
  liveBtn.classList.toggle("on", showLive);
  clockBtn.textContent = t == null ? "12/5 当日のみ表示" : `12/5 ${fmtMin(t)}${dbg ? " DEBUG" : ""}`;
  clockBtn.classList.toggle("debug", !!dbg);
  for (const p of pins) {
    let html = p.label.dataset.head;
    if (t != null && showLive) {
      html += `<span class="lives">`;
      const multi = p.v.names.length > 1;
      for (const n of p.v.names) {
        const vn = multi ? `<span class="vn">${esc(n)}</span>` : "";
        const { cur, nxt } = nowNext(n, t);
        if (cur) html += liveLine("now", vn, n, cur);
        if (nxt) html += liveLine("nx", vn, n, nxt);
        if (!cur && !nxt) html += `<span class="live gap">${vn}終演</span>`;
      }
      html += `</span>`;
    }
    if (html !== p.label.innerHTML) { p.label.innerHTML = html; p.w = 0; }
  }

}

let me = null, geoWatch = null, followMe = false;
const meAcc = document.createElement("div"); meAcc.className = "me-acc"; meAcc.style.display = "none";
const meDot = document.createElement("div"); meDot.className = "me"; meDot.style.display = "none";

let toastTimer = 0;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}
function onPos(pos) {
  const { latitude: lat, longitude: lon, accuracy } = pos.coords;
  const p = project(lat, lon);
  const mpp = 156543.03392 * Math.cos(lat * Math.PI / 180) / 2 ** TILE.z; // 1ピクセルあたりのm
  const inside = p.x >= 0 && p.y >= 0 && p.x <= IMG_W && p.y <= IMG_H;
  const first = !me;
  me = { x: p.x, y: p.y, accPx: Math.min(accuracy, 500) / mpp, lat, lon, inside };
  if (!inside) { meDot.style.display = meAcc.style.display = "none"; if (first || followMe) toast("現在地は地図の範囲外です"); followMe = false; return; }
  if (first || followMe) { centerOn(me, Math.max(s, 0.9)); followMe = false; }
  update();
}
function onPosErr(err) {
  const msg = { 1: "位置情報の利用が許可されていません", 2: "現在地を取得できません", 3: "現在地の取得がタイムアウトしました" }[err.code] || "現在地を取得できません";
  toast(window.isSecureContext ? msg : "現在地は https で開いたときだけ使えます");
  document.getElementById("btn-geo").classList.remove("active");
  if (geoWatch != null) { navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
}
function startGeo() {
  const btn = document.getElementById("btn-geo");
  if (!navigator.geolocation) { toast("この端末では現在地を取得できません"); return; }
  if (!window.isSecureContext) { toast("現在地は https で開いたときだけ使えます"); return; }
  btn.classList.add("active");
  if (geoWatch == null) {
    toast("現在地を取得中…");
    geoWatch = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  } else if (me && me.inside) centerOn(me, Math.max(s, 0.9));
  else followMe = true;
}

// ---- パン・ズーム(screen = image * s + t) ----
let s = 1, tx = 0, ty = 0;
let minS = 0.1;
const MAX_S = 2.5;

function clampView() {
  const W = vp.clientWidth, H = vp.clientHeight;
  s = Math.min(MAX_S, Math.max(minS, s));
  const iw = IMG_W * s, ih = IMG_H * s;
  tx = iw <= W ? (W - iw) / 2 : Math.min(0, Math.max(W - iw, tx));
  ty = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, ty));
}

// ラベル配置: 重なったら周囲の候補位置へずらし、引き出し線でつなぐ
function overlaps(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
function layoutLabels() {
  for (const p of pins) if (!p.w) { p.w = p.label.offsetWidth; p.h = p.label.offsetHeight; }
  const pts = pins.map(p => ({ x: p.x * s + tx, y: p.y * s + ty }));
  const dotRects = pts.map(q => ({ x: q.x - 8, y: q.y - 8, w: 16, h: 16 }));
  const order = [...pins].sort((a, b) => a.rank - b.rank || a.y - b.y);
  const placed = [];
  for (const p of order) {
    const q = pts[p.i], w = p.w, h = p.h;
    const cands = [
      [10, -h / 2], [-10 - w, -h / 2],
    ];
    for (let k = 1; k <= 9; k++) {
      const d = k * 15;
      cands.push([10 + d * .4, -h / 2 - d], [10 + d * .4, -h / 2 + d],
                 [-10 - w - d * .4, -h / 2 - d], [-10 - w - d * .4, -h / 2 + d],
                 [10 + d, -h / 2], [-10 - w - d, -h / 2],
                 [-w / 2, -10 - h - d * .6], [-w / 2, 10 + d * .6]);
    }
    let best = null;
    const W = vp.clientWidth, onScreen = q.x > 0 && q.x < W;
    // 1周目は画面内に収まる位置だけ、2周目は画面外も許す
    for (const strict of onScreen ? [true, false] : [false]) {
      for (const [dx, dy] of cands) {
        const r = { x: q.x + dx, y: q.y + dy, w, h };
        if (strict && (r.x < 2 || r.x + w > W - 2)) continue;
        if (placed.some(o => overlaps(r, o))) continue;
        if (dotRects.some((d, j) => j !== p.i && overlaps(r, d))) continue;
        best = r; break;
      }
      if (best) break;
    }
    best = best || { x: q.x + 10, y: q.y - h / 2, w, h };
    placed.push(best);
    p.rect = best;
    p.label.style.transform = `translate3d(${best.x}px,${best.y}px,0)`;
    p.dot.style.transform = `translate3d(${q.x}px,${q.y}px,0)`;
    // ラベルがドットから離れたら引き出し線
    const ax = Math.min(Math.max(q.x, best.x), best.x + w), ay = Math.min(Math.max(q.y, best.y), best.y + h);
    const far = Math.hypot(ax - q.x, ay - q.y) > 14;
    p.line.setAttribute("x1", q.x); p.line.setAttribute("y1", q.y);
    p.line.setAttribute("x2", ax); p.line.setAttribute("y2", ay);
    p.line.style.display = far ? "" : "none";
  }
  if (me) {
    const q = { x: me.x * s + tx, y: me.y * s + ty }, r = me.accPx * s;
    meDot.style.display = meAcc.style.display = "";
    meDot.style.transform = `translate3d(${q.x}px,${q.y}px,0)`;
    meAcc.style.width = meAcc.style.height = `${2 * r}px`;
    meAcc.style.transform = `translate3d(${q.x - r}px,${q.y - r}px,0)`;
  }
  routePath.setAttribute("points", showRoute ? routePins.map(i => `${pts[i].x},${pts[i].y}`).join(" ") : "");
}

let raf = 0;
function render() {
  raf = 0;
  img.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${s})`;
  layoutLabels();
}
function update() { clampView(); if (!raf) raf = requestAnimationFrame(render); }

function zoomAt(sx, sy, factor) {
  const ix = (sx - tx) / s, iy = (sy - ty) / s;
  s = Math.min(MAX_S, Math.max(minS, s * factor));
  tx = sx - ix * s; ty = sy - iy * s;
  update();
}
function centerOn(pin, scale) {
  const W = vp.clientWidth, H = vp.clientHeight;
  if (scale) s = scale;
  const sheetH = sheet.classList.contains("open") ? sheet.offsetHeight : 0;
  tx = W / 2 - pin.x * s; ty = (H - sheetH) / 2 + 20 - pin.y * s;
  update();
}

function fitAll() {
  const W = vp.clientWidth, H = vp.clientHeight;
  minS = Math.min(W / IMG_W, H / IMG_H);
  const xs = pins.map(p => p.x), ys = pins.map(p => p.y);
  const pad = { l: 40, r: 110, t: 64, b: 64 };
  const bx0 = Math.min(...xs), bx1 = Math.max(...xs);
  const by0 = Math.min(...ys), by1 = Math.max(...ys);
  s = Math.min((W - pad.l - pad.r) / (bx1 - bx0), (H - pad.t - pad.b) / (by1 - by0));
  s = Math.min(MAX_S, Math.max(minS, s));
  tx = pad.l + ((W - pad.l - pad.r) - (bx1 - bx0) * s) / 2 - bx0 * s;
  ty = pad.t + ((H - pad.t - pad.b) - (by1 - by0) * s) / 2 - by0 * s;
  update();
}

function actRow(venue, a, extra) {

  let h = "";
  if (pr && pr.p) h = `<span class="prof">${esc(pr.p)}${pr.k ? ' <span class="warn">※出典なし・要確認</span>' : ""}${pr.u ? ' <span class="warn">※同名の別アーティストかも</span>' : ""}</span>`;

// ルートの隙間(10分以上)を空き時間とする
function freeWindows() {
  const all = Object.values(TIMETABLE).flat().filter(a => !a.ev);
  const dayS = Math.min(...all.map(a => toMin(a.s))), dayE = Math.max(...all.map(a => toMin(a.e)));
  const ws = [];
  let cur = dayS, prev = null;
  for (const r of ROUTE) {
    if (toMin(r.s) - cur >= 10) ws.push({ s: cur, e: toMin(r.s), prev, next: r });
    if (toMin(r.e) > cur) { cur = toMin(r.e); prev = r; }
  }
  if (dayE - cur >= 10) ws.push({ s: cur, e: dayE, prev, next: null });
  return ws;
}
function showFree() {
  let html = "";
  if (!ROUTE.length) html += `<div class="missed">ルートが空なので、終日が空き時間です。会場や「見たい一覧」で「＋ ルート」を押すと、その隙間だけを出します。</div>`;
  for (const w of freeWindows()) {
    const { prev, next } = w;
    const pv = prev && pins[venueToPin[prev.venue]], nv = next && pins[venueToPin[next.venue]];
    const ws = fmtMin(w.s), we = fmtMin(w.e);
    html += `<div class="win-head">${ws}–${we}<small>` +
      `${prev ? `前: ${esc(prev.act)}(${esc(prev.venue)})` : "最初"}${next ? ` → 次: ${esc(next.act)}(${esc(next.venue)})` : " → 最後"}</small></div>`;
    w.s = ws; w.e = we;
    const items = [];
    for (const [venue, acts] of Object.entries(TIMETABLE)) for (const a of acts) {
      if (a.c || a.ev) continue;
      const ov = Math.min(toMin(a.e), toMin(w.e)) - Math.max(toMin(a.s), toMin(w.s));
      if (ov < 10) continue;
      const vp_ = pins[venueToPin[venue]];
      const wk = [pv ? `前から${walkMin(pv.v, vp_.v)}分` : "", nv ? `次へ${walkMin(vp_.v, nv.v)}分` : ""].filter(Boolean).join(" / ");
      items.push({ venue, a, wk, d: (pv ? walkMin(pv.v, vp_.v) : 0) + (nv ? walkMin(vp_.v, nv.v) : 0) });
    }
    items.sort((x, y) => x.d - y.d || x.a.s.localeCompare(y.a.s));
    html += items.map(({ venue, a, wk }) => actRow(venue, a, `${venue}${wk ? "・" + wk : ""}`)).join("");
  }
  openSheet("空き時間に見られるアクト", "ルートの隙間ごと。移動が近い順(前の会場から＋次の会場までの徒歩)", html, () => redraw(showFree));
}
function showVenue(pin) {

function showRouteList() {
  let html = "", prev = null, prevR = null;
  if (!ROUTE.length) html += `<div class="missed">ルートはまだ空です。地図の会場をタップするか、「見たい一覧」で検索して「＋ ルート」を押すと、ここに時間順で並びます。</div>`;
  ROUTE.forEach((r, k) => {
    const pin = pins[venueToPin[r.venue]] || null;
    const warn = [];
    if (pin && prev && pin !== prev) {
      const wk = walkMin(prev.v, pin.v), gap = toMin(r.s) - toMin(prevR.e);
      html += `<div class="walk">↓ 徒歩 約${wk}分${gap >= 0 && wk - gap >= 3 ? `<span class="warn"> 間は${gap}分しかない</span>` : ""}</div>`;
    }
    if (prevR && toMin(r.s) < toMin(prevR.e)) warn.push(`前と${toMin(prevR.e) - toMin(r.s)}分被り`);
    if (!r.a) warn.push("タイムテーブルに見当たらない");
    const custom = r.a && (r.s !== r.a.s || r.e !== r.a.e) ? `(本来 ${r.a.s}–${r.a.e})` : "";
    html += `<div class="step" data-pin="${pin ? pin.i : ""}">` +
      `<span class="num">${k + 1}</span><span><div class="t">${r.s}–${r.e}${custom}　${esc(r.venue)}</div>` +
      `<div class="a">${esc(r.act)}${badge(r.act)}</div>${r.memo ? `<div class="m">${esc(r.memo)}</div>` : ""}` +
      `${warn.length ? `<div class="m warn">${esc(warn.join(" / "))}</div>` : ""}</span>` +
      `<button type="button" class="edit-btn" data-k="${k}" aria-label="編集">✎</button></div>`;
    if (pin) prev = pin;
    if (!prevR || toMin(r.e) > toMin(prevR.e)) prevR = r;
  });
  // ルートに入らなかった見たいバンド
  const names = new Set(ROUTE.map(r => r.act));
  const missed = [];
  for (const [venue, acts] of Object.entries(TIMETABLE))
    for (const a of acts) if (WANT[a.n] && WANT[a.n] <= 4 && !names.has(a.n)) missed.push(`${a.n}(${venue} ${a.s})`);
  const absent = Object.keys(WANT).filter(n => !Object.values(TIMETABLE).some(l => l.some(a => a.n === n)));
  if (missed.length) html += `<div class="missed">見たいけどルート外: ${esc(missed.join("、"))}</div>`;
  if (absent.length) html += `<div class="missed">タイムテーブルに無い: ${esc(absent.join("、"))}</div>`;
  html += shareHtml();
  openSheet("巡回ルート", "タップでその会場へ移動・✎で時間とメモを変更", html, () => redraw(showRouteList));
}

function planEntry(r) { return plan.route.find(x => x.venue === r.venue && x.act === r.act); }
const norm = t => t.normalize("NFKC").toLowerCase().replace(/\s+/g, "");
let wantQuery = "";
function wantResults() {
  const q = norm(wantQuery), rows = [];
  for (const [venue, acts] of Object.entries(TIMETABLE))
    for (const a of acts) {
      if (a.ev) continue;
      if (q ? norm(a.n).includes(q) : WANT[a.n]) rows.push({ venue, a });
    }
  rows.sort((x, y) => x.a.s.localeCompare(y.a.s) || (WANT[x.a.n] || 9) - (WANT[y.a.n] || 9));
  if (!rows.length) return `<div class="missed">${q ? "見つかりません" : "まだありません。上の欄でバンド名を検索して、優先度(☆)を付けてください。会場をタップしても付けられます。"}</div>`;
  return rows.slice(0, 80).map(({ venue, a }) => actRow(venue, a, venue)).join("");
}

    `<div id="want-res">${wantResults()}</div>` + shareHtml();
  openSheet("見たい一覧(時間順)", "☆で優先度、＋ ルートで巡回ルートに追加。青背景 = ルートに入っているもの", html,
    () => { const el = document.getElementById("want-res"); if (el) redraw(() => el.innerHTML = wantResults()); });
}

// ---- 共有リンク(見たい一覧とルートを URL の # に入れる) ----
const b64u = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
async function encodePlan(pl) {
  const json = JSON.stringify({ w: pl.want, r: pl.route.map(r => [r.venue, r.act, r.s || "", r.e || "", r.memo || ""]) });
  const raw = new TextEncoder().encode(json);
  if (window.CompressionStream) return "z" + b64u(await pipe(raw, new CompressionStream("deflate-raw")));
  return "j" + b64u(raw);
}
async function decodePlan(code) {
  let bytes = unb64u(code.slice(1));
  if (code[0] === "z") bytes = await pipe(bytes, new DecompressionStream("deflate-raw"));
  const d = JSON.parse(new TextDecoder().decode(bytes));
  return { want: d.w || {}, route: (d.r || []).map(([venue, act, s, e, memo]) => {
    const r = { venue, act }; if (s) r.s = s; if (e) r.e = e; if (memo) r.memo = memo; return r; }) };
}
function shareHtml() {
  return `<div class="dbg share"><div class="btns">
    <button class="go" type="button" data-share="link">共有リンクを作る</button>
    <button type="button" data-share="clear">見たい一覧とルートを全部消す</button></div>
    <p>リンクを開いた端末に、この見たい一覧とルートがそのまま入ります。別の端末への引き継ぎや、友だちとの共有に使えます。データはこの端末の中だけに保存され、どこにも送信されません。</p>
    <div id="share-out"></div></div>`;
}
async function makeShareLink() {
  const url = location.origin + location.pathname + "#p=" + await encodePlan(plan);
  const out = document.getElementById("share-out");
  if (navigator.share) { try { await navigator.share({ title: "下北沢にて'26 見たい一覧", url }); return; } catch (e) { if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); toast("共有リンクをコピーしました"); } catch (_) {}
  if (out) out.innerHTML = `<textarea readonly rows="3">${esc(url)}</textarea>`;
}
async function importFromHash() {
  const m = location.hash.match(/^#p=(.+)$/);
  if (!m) return false;
  history.replaceState(null, "", location.pathname + location.search);
  try {
    const pl = await decodePlan(m[1]);
    const has = Object.keys(plan.want).length || plan.route.length;
    if (has && !confirm(`共有リンクの内容(見たい ${Object.keys(pl.want).length}組・ルート ${pl.route.length}件)で、この端末の見たい一覧とルートを置き換えますか?`)) return true;
    plan = pl; savePlan(); derive(); refreshPins();
    toast(`見たい ${Object.keys(pl.want).length}組・ルート ${pl.route.length}件を読み込みました`);
    showRouteList();
  } catch (e) { toast("共有リンクを読み込めませんでした"); }
  return true;
}
function showHelp() {
  openSheet("使い方", "下北沢にて'26 (2026.12.5) 非公式の会場マップ", `<div class="dbg">
    <p style="color:inherit;font-size:13px;line-height:1.7;margin:0">
    ・地図の会場をタップ → その会場の出演表<br>
    ・「☆ 見たい?」で優先度を付ける / 「＋ ルート」で巡回ルートに追加<br>
    ・「見たい一覧」ではバンド名で検索できます<br>
    ・「ルート」は追加したアクトを時間順に並べ、被りや移動時間の足りなさを表示。✎で途中参加・途中抜けの時間を変えられます<br>
    ・「空き時間」はルートの隙間に見られるアクトを、移動が近い順に表示<br>
    ・当日は会場ラベルに「● 今」と「次」のアクトが出ます。右下の◎で現在地<br>
    ・入力した内容はこの端末にだけ保存されます。「共有リンクを作る」で別の端末や友だちに渡せます</p>
    <div class="btns"><button class="go" type="button" data-help="want">見たいバンドを探す</button></div></div>`);
}
sheetBody.addEventListener("click", e => {
  const go = e.target.closest(".go-btn");

  const ed = e.target.closest(".edit-btn");

      if (act === "reset") { delete pe.s; delete pe.e; }

        const sv = document.getElementById("ed-s").value, ev = document.getElementById("ed-e").value;
        const m = document.getElementById("ed-m").value.trim();
        if (sv && ev && toMin(ev) <= toMin(sv)) { toast("終わりは始まりより後にしてください"); return; }
        if (sv && (!r.a || sv !== r.a.s)) pe.s = sv; else delete pe.s;
        if (ev && (!r.a || ev !== r.a.e)) pe.e = ev; else delete pe.e;
        if (m) pe.memo = m; else delete pe.memo;

    showRouteList(); return;

  const sh = e.target.closest("[data-share]");
  if (sh) {
    if (sh.dataset.share === "link") makeShareLink();
    else if (confirm("この端末の見たい一覧とルートを全部消しますか?")) { plan = { want: {}, route: [] }; planChanged(); }

  if (e.target.closest("[data-help]")) { showWantList(); setTimeout(() => document.getElementById("want-q")?.focus(), 250); return; }
  const b = e.target.closest(".step");
  if (b && b.dataset.pin !== "") centerOn(pins[+b.dataset.pin], Math.max(s, 0.9));

document.getElementById("btn-reset").addEventListener("click", () => { closeSheet(); fitAll(); });

// ---- ポインタ(タッチ/マウス) ----
const ptrs = new Map();
let last = null;
let lastTap = 0, downAt = null, moved = 0;

function gesture() {
  const pts = [...ptrs.values()];
  if (pts.length === 1) return { x: pts[0].x, y: pts[0].y, d: 0 };
  const [a, b] = pts;
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
}
function hitPin(x, y) {
  let best = null, bd = 22;
  for (const p of pins) {
    const r = p.rect;
    if (r && x >= r.x - 4 && x <= r.x + r.w + 4 && y >= r.y - 4 && y <= r.y + r.h + 4) return p;
    const d = Math.hypot(p.x * s + tx - x, p.y * s + ty - y);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

vp.addEventListener("pointerdown", e => {
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  last = gesture();
  vp.classList.add("dragging");
  if (ptrs.size === 1) { downAt = { x: e.clientX, y: e.clientY }; moved = 0; }
  else downAt = null;
});

vp.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const g = gesture();
  if (ptrs.size >= 2 && last.d > 0) {
    const ix = (last.x - tx) / s, iy = (last.y - ty) / s;
    s = Math.min(MAX_S, Math.max(minS, s * g.d / last.d));
    tx = g.x - ix * s; ty = g.y - iy * s;
  } else {
    tx += g.x - last.x; ty += g.y - last.y;
  }
  if (downAt) moved = Math.max(moved, Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y));
  last = g;
  update();
});

function endPtr(e) {
  const wasSingle = ptrs.size === 1 && downAt;
  ptrs.delete(e.pointerId);
  last = ptrs.size ? gesture() : null;
  if (!ptrs.size) vp.classList.remove("dragging");
  if (e.type !== "pointerup" || !wasSingle || moved > 8) { lastTap = 0; return; }
  // タップ判定: ピンならタイムテーブル、何もない所のダブルタップは拡大
  const p = hitPin(e.clientX, e.clientY);
  if (p) { showVenue(p); lastTap = 0; return; }
  const now = performance.now();
  if (now - lastTap < 320) { zoomAt(e.clientX, e.clientY, 2); lastTap = 0; }
  else lastTap = now;
}
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("pointercancel", endPtr);

vp.addEventListener("wheel", e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

// iOS Safari のページ自体のピンチ拡大を抑止
document.addEventListener("gesturestart", e => e.preventDefault());
addEventListener("resize", () => { minS = Math.min(vp.clientWidth / IMG_W, vp.clientHeight / IMG_H); update(); });

refreshPins();
setInterval(refreshLive, 20000);
if (img.complete) fitAll(); else img.addEventListener("load", fitAll);
importFromHash().then(imported => { if (!imported && !hadPlan && !location.hash) showHelp(); });
document.getElementById("btn-help").addEventListener("click", showHelp);
if (location.hash === "#route") showRouteList();
if (location.hash === "#free") showFree();
if (location.hash.startsWith("#venue=")) {
  const p = pins[venueToPin[decodeURIComponent(location.hash.slice(7))]];
  if (p) showVenue(p);
}
